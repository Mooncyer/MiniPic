plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingPath = System.getenv('MINIPIC_KEYSTORE_PROPERTIES') ?: '../../../MiniPic-signing/keystore.properties'
def signingFile = rootProject.file(signingPath)
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

def hasReleaseSigning = signingProperties.getProperty('storeFile') &&
        signingProperties.getProperty('storePassword') &&
        signingProperties.getProperty('keyAlias') &&
        signingProperties.getProperty('keyPassword')

android {
    namespace 'mini.pic'
    compileSdk 35
    defaultConfig {
        applicationId 'mini.pic'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '0.0.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    splits { abi { enable true; reset(); include 'armeabi-v7a','arm64-v8a'; universalApk true } }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
