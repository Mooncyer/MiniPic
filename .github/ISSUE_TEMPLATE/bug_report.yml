name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题仍存在于最新版本，并删除日志中的个人图片路径、设备序列号和其他隐私信息。
  - type: input
    id: version
    attributes:
      label: MiniPic version
      placeholder: 0.0.7
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: OPPO Watch OWW211 / Android 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: 请列出最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: 不要提交签名密码、keystore、账号信息或原始私人图片。
